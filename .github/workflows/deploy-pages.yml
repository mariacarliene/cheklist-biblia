name: Deploy Pages

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Publish to GitHub Pages
        uses: github/pages-deploy-action@v0
        with:
          branch: gh-pages  # branch onde o site será publicado
          folder: ./        # pasta raiz do repositório
